[package]
name = "docugraph"
version = "0.1.0"
edition = "2024"
# let-chains and `slice::as_chunks` are both 1.88; edition 2024 alone would be 1.85.
rust-version = "1.88"
description = "Universal Document Knowledge Graph MCP Server for AI Agents"
readme = "README.md"
license = "MIT"
keywords = ["mcp", "pdf", "rag", "retrieval", "graph"]
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/yoiberdev/docugraph-mcp"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
lopdf = { version = "0.45", features = ["serde"] }
rmcp = { version = "3.4", features = ["server", "macros", "transport-io"] }
base64 = "0.23"
miniz_oxide = "0.8"


[dev-dependencies]
tempfile = "3.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

